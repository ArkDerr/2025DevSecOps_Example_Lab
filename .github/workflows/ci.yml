name: CI - Build, Test & JaCoCo, Snyk y Sonar

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  pages: write
  id-token: write

env:
  PROJECT_DIR: .

jobs:
  snyk-scan:
    name: Snyk Security Scan (JSON)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk auth
        run: snyk auth "${SNYK_TOKEN}"

      - name: Snyk test → JSON
        working-directory: ./Backend
        continue-on-error: true
        run: |
          chmod +x ./mvnw || true
          snyk test \
            --file=pom.xml \
            --package-manager=maven \
            --severity-threshold=high \
            --json-file-output=snyk-report.json

      - name: Snyk summary
        if: always()
        working-directory: ./Backend
        run: |
          sudo apt-get update >/dev/null && sudo apt-get install -y jq >/dev/null
          TOTAL=$(jq '.vulnerabilities | length' snyk-report.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.vulnerabilities[] | select(.severity=="high")] | length' snyk-report.json 2>/dev/null || echo 0)
          MED=$(jq '[.vulnerabilities[] | select(.severity=="medium")] | length' snyk-report.json 2>/dev/null || echo 0)
          LOW=$(jq '[.vulnerabilities[] | select(.severity=="low")] | length' snyk-report.json 2>/dev/null || echo 0)
          {
            echo "### Snyk Summary"
            echo ""
            echo "- Total: **$TOTAL**"
            echo "- High: **$HIGH**"
            echo "- Medium: **$MED**"
            echo "- Low: **$LOW**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: ./Backend/snyk-report.json
          if-no-files-found: warn

  build-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: snyk-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test (with coverage)
        working-directory: ./Backend
        run: mvn -B -U clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
          if-no-files-found: ignore

      - name: Publish JUnit test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/*.xml'
          check_name: 'JUnit Results'
          detailed_summary: true

  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-test-coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Run SonarCloud Analysis (Maven)
        working-directory: ./Backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -U verify sonar:sonar \
            -Dsonar.organization=arkderr \
            -Dsonar.projectKey=ArkDerr_2025EjemploDevSecOps_S9 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.branch.name=${{ github.ref_name }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  container-scan:
    name: Snyk Container (backend)
    runs-on: ubuntu-latest
    needs: [build-test-coverage]

    steps:
      - uses: actions/checkout@v4

      # Tag válido: pr-<n> en PR, sha-<7> en push
      - name: Compute IMAGE_TAG
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "IMAGE_TAG=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            -t profedanielduoc/mi-backend:${{ steps.tag.outputs.IMAGE_TAG }} \
            -f Backend/Dockerfile \
            ./Backend

      # --- INSTALA y VERIFICA SNYK CLI ---
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Check Snyk installed
        run: |
          which snyk
          snyk --version

      - name: Snyk Container scan → JSON
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "${SNYK_TOKEN}"
          snyk container test profedanielduoc/mi-backend:${{ steps.tag.outputs.IMAGE_TAG }} \
            --file=Backend/Dockerfile \
            --severity-threshold=low \
            --json-file-output=snyk-container-report.json

      - name: Snyk Container Summary
        if: always()
        run: |
          sudo apt-get update >/dev/null && sudo apt-get install -y jq >/dev/null
          FILE="snyk-container-report.json"
          TOTAL=$(jq '.vulnerabilities | length' "$FILE" 2>/dev/null || echo 0)
          HIGH=$(jq '[.vulnerabilities[] | select(.severity=="high")] | length' "$FILE" 2>/dev/null || echo 0)
          MED=$(jq '[.vulnerabilities[] | select(.severity=="medium")] | length' "$FILE" 2>/dev/null || echo 0)
          LOW=$(jq '[.vulnerabilities[] | select(.severity=="low")] | length' "$FILE" 2>/dev/null || echo 0)
          {
            echo "### 🐳 Snyk Container Summary (Backend)"
            echo ""
            echo "- Total: **$TOTAL**"
            echo "- High: **$HIGH**"
            echo "- Medium: **$MED**"
            echo "- Low: **$LOW**"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- SUBE EL JSON (desde RAÍZ) ---
      - name: Upload Snyk Container JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-container-report
          path: snyk-container-report.json
          if-no-files-found: warn



