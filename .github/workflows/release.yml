name: Release - Build & Push (Backend & Frontend)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  DOCKER_IMAGE_BACKEND: ${{ vars.DOCKER_IMAGE_BACKEND }}
  DOCKER_IMAGE_FRONTEND: ${{ vars.DOCKER_IMAGE_FRONTEND }}

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "TAG=sha-${SHA_TAG}" >> $GITHUB_OUTPUT
          fi
          echo "Computed tag: $(cat $GITHUB_OUTPUT || true)"

      # ---------- BACKEND ----------
      - name: Build & Push BACKEND (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE_BACKEND }}:${{ steps.tags.outputs.TAG }}
            ${{ env.DOCKER_IMAGE_BACKEND }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ---------- FRONTEND ----------
      - name: Build & Push FRONTEND (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./Web
          file: ./Web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ steps.tags.outputs.TAG }}
            ${{ env.DOCKER_IMAGE_FRONTEND }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ---------- (Opcional) Auditoría de imágenes ya publicadas ----------
      - name: Snyk Container - backend (post-push)
        if: always()
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.DOCKER_IMAGE_BACKEND }}:${{ steps.tags.outputs.TAG }}
          args: --severity-threshold=high

      - name: Snyk Container - frontend (post-push)
        if: always()
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ steps.tags.outputs.TAG }}
          args: --severity-threshold=high
